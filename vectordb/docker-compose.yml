services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_client
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    container_name: homeschool_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_READONLY_USER};Password=${POSTGRES_READONLY_PASSWORD}"
      ConnectionStrings__IdentityConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_IDENTITY_RW_USER};Password=${POSTGRES_IDENTITY_RW_PASSWORD}"
      OPENAI__ApiKey: ${OPENAI_API_KEY}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET}
      Stripe__PriceId: ${STRIPE_PRICE_ID}
      Email__Host: mailpit
      Email__Port: "1025"
      Email__From: "no-reply@homeschool.local"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../:/src
      - ./empty.env:/src/.env
      - ./empty.env:/src/vectordb/.env
      - ../logs:/app/logs
      - api_nuget:/root/.nuget/packages
    depends_on:
      - db

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    container_name: homeschool_web
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../web:/app
      - /app/node_modules
    depends_on:
      - api

