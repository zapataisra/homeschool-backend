services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_client
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    container_name: homeschool_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_READONLY_USER};Password=${POSTGRES_READONLY_PASSWORD}"
    ports:
      - "8080:8080"
    volumes:
      - ../:/src
      - ../logs:/app/logs
      - api_nuget:/root/.nuget/packages
    depends_on:
      - db

  api-prod:
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    container_name: homeschool_api_prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_READONLY_USER};Password=${POSTGRES_READONLY_PASSWORD}"
      EMBEDDING_MODEL_DIR: /app/models/all-MiniLM-L6-v2
    ports:
      - "8081:8080"
    volumes:
      - ../models:/app/models
      - ../logs:/app/logs
    depends_on:
      - db

volumes:
  pgdata:
  api_nuget: